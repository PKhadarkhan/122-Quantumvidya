<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Library Assistant | Quantum Vidya</title>
    
    <!-- Original Styles for Navbar -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Tailwind and Alpine for Chat UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        body {
            /* Keep Quantum Vidya's dark theme */
            background: var(--bg-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow: hidden;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-message-user {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-message-ai {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .prose pre {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .prose code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem;
            color: #e2e8f0;
        }

        .prose p {
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .prose h1, .prose h2, .prose h3 {
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .prose ul, .prose ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .prose li {
            margin-bottom: 0.25rem;
        }

        .prose a {
            color: #93c5fd;
            text-decoration: underline;
        }
    </style>
</head>

<body class="text-gray-200" x-data="chatApp()">

    <!-- Quantum Vidya Navbar -->
    <nav class="navbar flex-between container" style="position: relative; z-index: 10;">
        <a href="index.html" class="logo" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:white; font-weight:bold; font-size:1.2rem;">
            <div style="background:var(--primary); padding:4px 8px; border-radius:4px; color:black;">Q</div>
            Quantum Vidya
        </a>
        <ul class="nav-links" style="display:flex; gap:20px; list-style:none;">
            <li><a href="index.html" style="color:white; text-decoration:none;">Home</a></li>
            <li><a href="elibrary.html" style="color:var(--primary); text-decoration:none;">Library</a></li>
            <li><a href="ai-notes.html" style="color:white; text-decoration:none;">AI Notes</a></li>
            <li><a href="dashboard.html" style="color:white; text-decoration:none;">Dashboard</a></li>
        </ul>
    </nav>

    <!-- Chat Interface -->
    <div class="flex-1 flex justify-center items-center p-4">
        <div class="glass-container w-full max-w-4xl h-[85vh] rounded-3xl flex flex-col overflow-hidden relative">

            <!-- Header -->
            <div class="p-6 border-b border-white/10 flex justify-between items-center transition-all duration-300">
                <h1 class="text-2xl font-bold text-white tracking-wide">📚 AI Library Assistant <span class="text-sm font-light text-blue-200 ml-2">Gemma 3 4B</span></h1>
            </div>

            <!-- Chat Box -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="messages-container" x-ref="messagesBox">

                <template x-for="(msg, index) in messages" :key="index">
                    <div class="flex flex-col" :class="msg.is_ai ? 'items-start' : 'items-end'">
                        <div class="text-xs text-white/50 mb-1 px-1" x-text="msg.sender"></div>
                        <div class="max-w-[85%] rounded-2xl p-5 shadow-sm relative overflow-hidden transition-all duration-300 transform scale-100"
                            :class="msg.is_ai ? 'glass-message-ai rounded-tl-none' : 'glass-message-user rounded-tr-none text-white'">
                            <div class="prose prose-invert max-w-none text-sm md:text-base" x-html="renderMarkdown(msg.text)"></div>

                            <!-- Typing Indicator for Streaming/Waiting -->
                            <template x-if="msg.is_ai && msg.is_streaming">
                                <span class="inline-flex ml-2 space-x-1 items-center py-2">
                                    <span class="w-2 h-2 bg-white/60 rounded-full animate-bounce"></span>
                                    <span class="w-2 h-2 bg-white/60 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                                    <span class="w-2 h-2 bg-white/60 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
                                </span>
                            </template>
                        </div>
                    </div>
                </template>

            </div>

            <!-- Input Area -->
            <div class="p-4 border-t border-white/10 bg-black/20">
                <form @submit.prevent="sendMessage" class="relative flex items-center">
                    <input x-model="newMessage" type="text" placeholder="What topic do you want to explore?"
                        class="w-full bg-white/5 text-white placeholder-white/40 border border-white/10 rounded-full px-6 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white/10 transition-all duration-300"
                        :disabled="isWaiting">
                    <button type="submit" :disabled="isWaiting || !newMessage.trim()"
                        class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-blue-600 hover:bg-blue-500 text-white rounded-full p-3 transition-colors focus:outline-none disabled:opacity-50 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- API Connection -->
    <script src="js/api.js"></script>
    <script>
        function chatApp() {
            return {
                messages: [
                    { sender: 'AI Library Assistant', text: 'Welcome to the Smart E-Library! I can provide topic explanations or retrieve notes from the library. What do you want to learn today?', is_ai: true }
                ],
                newMessage: '',
                isWaiting: false,

                async sendMessage() {
                    if (!this.newMessage.trim() || this.isWaiting) return;
                    
                    const userMsg = this.newMessage;
                    this.messages.push({ sender: 'You', text: userMsg, is_ai: false });
                    this.newMessage = '';
                    this.isWaiting = true;
                    this.scrollToBottom();

                    // Show typing indicator
                    this.messages.push({ sender: 'AI Library Assistant', text: '', is_ai: true, is_streaming: true });
                    this.scrollToBottom();

                    try {
                        const response = await QuantumAPI.chatLibrary(userMsg);
                        
                        // Remove typing indicator
                        this.messages.pop();
                        
                        // Add final response
                        this.messages.push({ sender: 'AI Library Assistant', text: response.reply || "Done.", is_ai: true });
                    } catch (err) {
                        this.messages.pop();
                        this.messages.push({ sender: 'System', text: 'Error fetching library explanation: ' + err.message, is_ai: true });
                    }
                    
                    this.isWaiting = false;
                    this.scrollToBottom();
                },

                scrollToBottom() {
                    setTimeout(() => {
                        if (this.$refs.messagesBox) {
                            this.$refs.messagesBox.scrollTop = this.$refs.messagesBox.scrollHeight;
                        }
                    }, 50);
                },

                renderMarkdown(text) {
                    if (!text) return '';
                    return marked.parse(text);
                }
            }
        }
    </script>
</body>
</html>
