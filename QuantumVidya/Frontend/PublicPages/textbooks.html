<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Textbook Generator | Quantum Vidya</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .output {
            margin-top: 32px;
            background: var(--surface);
            border: 1px solid var(--primary-glow);
            border-radius: var(--radius-md);
            padding: 32px;
            display: none;
            color: var(--text-main);
            line-height: 1.8;
        }

        .output h1, .output h2, .output h3 {
            color: var(--primary);
            margin-top: 32px;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 12px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <nav class="navbar scrolled flex-between container">
        <a href="index.html" class="logo">
            <div class="logo-icon">Q</div>
            Quantum Vidya
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="elibrary.html">Library</a></li>
            <li><a href="textbooks.html" class="active">Textbooks</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <main class="container page-container">
        <div class="glass-card animate-fade-in" style="max-width: 900px; margin: 0 auto;">
            <h1 class="text-gradient">📖 AI Textbook Generator</h1>
            <p>Generate full-length, structured university-standard textbooks using our advanced AI.</p>

            <div class="form-group grid-3" style="margin-bottom: 32px;">
                <div class="field">
                    <label class="form-label">Course Level</label>
                    <select id="levelInput" class="form-control">
                        <option value="School">School</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="UG">Undergraduate (UG)</option>
                        <option value="PG">Postgraduate (PG)</option>
                    </select>
                </div>
                <div class="field">
                    <label class="form-label">Course Name</label>
                    <input type="text" id="courseInput" class="form-control" placeholder="e.g. BTech CSE">
                </div>
                <div class="field">
                    <label class="form-label">Subject</label>
                    <input type="text" id="subjectInput" class="form-control" placeholder="e.g. Operating Systems">
                </div>
            </div>

            <div class="flex-center" style="justify-content: flex-start; gap: 16px;">
                <button class="btn btn-primary" id="generateBtn" onclick="generateBook()">
                    Generate Full Textbook
                </button>
                <span id="loadingSpinner" class="loader" style="display: none; width: 28px; height: 28px; border-width: 3px;"></span>
                <span id="loadingText" class="animate-fade-in" style="display:none; font-weight:600; color:var(--primary);">Generating... this might take a minute!</span>
            </div>

            <div class="output animate-fade-in" id="outputBox">
                <!-- Rendered markdown textbook will go here -->
            </div>
            
            <div style="margin-top: 32px;">
                <a href="elibrary.html" class="btn btn-secondary">← Back to Library</a>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        async function generateBook() {
            const level = document.getElementById("levelInput").value;
            const course = document.getElementById("courseInput").value.trim();
            const subject = document.getElementById("subjectInput").value.trim();

            if(!course || !subject) return alert("Please provide both Course Name and Subject.");

            const btn = document.getElementById("generateBtn");
            const spinner = document.getElementById("loadingSpinner");
            const loadingText = document.getElementById("loadingText");
            const outputBox = document.getElementById("outputBox");

            btn.disabled = true;
            spinner.style.display = "inline-block";
            loadingText.style.display = "inline-block";
            outputBox.style.display = "none";

            try {
                const data = await QuantumAPI.generateTextbook(level, course, subject);
                outputBox.innerHTML = marked.parse(data.textbook);
                outputBox.style.display = "block";
            } catch (err) {
                outputBox.innerHTML = `<p style="color: var(--danger);">Error communicating with AI Backend.</p>`;
                outputBox.style.display = "block";
                console.error(err);
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
                loadingText.style.display = "none";
            }
        }
    </script>
</body>
</html>
