<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Exams | Quantum Vidya</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-dark);
        }

        .navbar {
            background: rgba(5, 22, 26, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--surface-border);
        }

        /* Chat layout */
        .chat-container {
            height: 100vh;
            padding-top: 80px;
            padding-bottom: 140px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-history {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
            max-width: 90%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
            width: 100%;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user .avatar {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .ai .avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
        }

        .bubble {
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-main);
        }

        .user .bubble {
            background: rgba(255, 255, 255, 0.1);
            border-top-right-radius: 4px;
        }

        .ai .bubble {
            background: transparent;
            width: 100%;
            padding: 0;
        }

        /* Input Area */
        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, transparent, var(--bg-dark) 20%);
            padding: 30px 20px 40px;
            display: flex;
            justify-content: center;
        }

        .input-container {
            max-width: 800px;
            width: 100%;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .input-container:focus-within {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            padding: 8px 12px;
            max-height: 200px;
            outline: none;
            line-height: 1.5;
        }

        .send-btn {
            background: var(--primary);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-dark);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .send-btn:hover {
            transform: scale(1.1);
            background: var(--secondary);
        }

        /* Exam specific styling inside AI bubble */
        .exam-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-top: 10px;
        }

        .question-item {
            margin-bottom: 24px;
            animation: fadeIn 0.5s ease forwards;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin-top: 12px;
        }

        .options-list li {
            margin-bottom: 8px;
        }

        .options-list label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
        }

        .options-list label:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--primary-glow);
        }

        input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        /* Quick Option Buttons */
        .quick-options {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .quick-btn {
            background: rgba(15, 178, 190, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 24px;
            padding: 16px 20px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <nav class="navbar scrolled flex-between container">
        <a href="index.html" class="logo">
            <div class="logo-icon">Q</div>
            Quantum Vidya
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="elibrary.html">Library</a></li>
            <li><a href="exams.html" style="color: var(--primary);">Mock Exams</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <!-- Scrollable Chat Area -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-history" id="chatHistory">
            <!-- AI will populate this -->
        </div>
    </div>

    <!-- Fixed Bottom Input -->
    <div class="input-wrapper">
        <div class="input-container">
            <textarea id="questionInput" rows="1" placeholder="Type your answer here... (Press Enter to send)"></textarea>
            <button class="send-btn" id="askBtn" onclick="handleUserInput()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const inputField = document.getElementById('questionInput');
        const chatHistory = document.getElementById('chatHistory');
        const chatContainer = document.getElementById('chatContainer');
        const askBtn = document.getElementById('askBtn');

        let chatState = 0; 
        // 0 = Ask Course
        // 1 = Ask Subject
        // 2 = Ask Level
        // 3 = Generating/Taking Exam
        
        const examDetails = { course: "", subject: "", level: "" };
        let currentExamData = null;

        inputField.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleUserInput();
            }
        });

        function appendMessage(role, contentHtml, isTyping = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerText = role === 'user' ? 'U' : 'Q';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (isTyping) {
                bubble.innerHTML = `
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
                bubble.id = "typingIndicatorBubble";
            } else {
                bubble.innerHTML = contentHtml;
            }

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatHistory.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicatorBubble');
            if (el) el.parentElement.remove();
        }

        // Initialize Chat
        setTimeout(() => {
            appendMessage('ai', `
                <div style="padding: 16px 20px;">
                    <p style="margin: 0; font-size: 1.1rem; font-weight: 600;" class="text-gradient">Welcome to Quantum AI Mock Exams! 🎓</p>
                    <p style="margin-top: 8px; color: var(--text-muted);">I can generate highly targeted practice exams for you in seconds.</p>
                    <p style="margin-top: 16px;">To get started, <b>what course are you studying?</b></p>
                    <div class="quick-options">
                        <button class="quick-btn" onclick="quickSelect('BCA')">BCA</button>
                        <button class="quick-btn" onclick="quickSelect('B.Tech')">B.Tech</button>
                        <button class="quick-btn" onclick="quickSelect('BSc')">BSc</button>
                    </div>
                </div>
            `);
        }, 500);

        function quickSelect(text) {
            inputField.value = text;
            handleUserInput();
        }

        async function handleUserInput() {
            const val = inputField.value.trim();
            if(!val) return;

            // User Message
            appendMessage('user', val);
            inputField.value = '';
            inputField.style.height = 'auto';

            if (chatState === 0) {
                examDetails.course = val;
                chatState++;
                setTimeout(() => {
                    appendMessage('ai', `
                        <div style="padding: 16px 20px;">
                            <p style="margin:0;">Awesome! You selected <b>${val}</b>.</p>
                            <p style="margin-top:8px;">Now, <b>what subject</b> do you want to be tested on?</p>
                            <div class="quick-options">
                                <button class="quick-btn" onclick="quickSelect('DBMS')">DBMS</button>
                                <button class="quick-btn" onclick="quickSelect('Operating Systems')">Operating Systems</button>
                                <button class="quick-btn" onclick="quickSelect('AI')">AI</button>
                            </div>
                        </div>
                    `);
                }, 600);
            } 
            else if (chatState === 1) {
                examDetails.subject = val;
                chatState++;
                setTimeout(() => {
                    appendMessage('ai', `
                        <div style="padding: 16px 20px;">
                            <p style="margin:0;">Great choice.</p>
                            <p style="margin-top:8px;">Finally, what <b>difficulty level</b> would you prefer?</p>
                            <div class="quick-options">
                                <button class="quick-btn" onclick="quickSelect('Beginner')">Beginner</button>
                                <button class="quick-btn" onclick="quickSelect('Intermediate')">Intermediate</button>
                                <button class="quick-btn" onclick="quickSelect('Advanced')">Advanced</button>
                            </div>
                        </div>
                    `);
                }, 600);
            }
            else if (chatState === 2) {
                examDetails.level = val;
                chatState++;
                appendMessage('ai', '', true); // Typing indicator
                
                try {
                    const data = await QuantumAPI.getExam(examDetails.course, examDetails.subject, examDetails.level);
                    removeTypingIndicator();
                    currentExamData = data;
                    renderExamInChat(data);
                } catch (err) {
                    removeTypingIndicator();
                    appendMessage('ai', `<div style="padding: 16px 20px; color: var(--danger);">Error communicating with AI Backend. Ensure the backend is running locally at http://localhost:8080</div>`);
                    chatState = 2; // Reset state so they can try again
                }
            }
        }

        function renderExamInChat(data) {
            let html = `
                <div class="exam-card">
                    <h2 class="text-gradient" style="margin-bottom: 8px;">${data.subject} Assessment</h2>
                    <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem;">Level: <b>${data.level}</b> | Total Marks: <b>${data.total_marks}</b></p>
            `;
            
            data.questions.forEach((q, idx) => {
                html += `
                    <div class="question-item">
                        <h3 style="font-size: 1.1rem; margin-bottom: 12px; line-height: 1.4;">
                            <span style="color:var(--primary)">Q${idx + 1}.</span> ${q.question}
                        </h3>
                        <ul class="options-list">
                            ${Object.entries(q.options).map(([key, val]) => `
                                <li>
                                    <label>
                                        <input type="radio" name="q_${q.id}" value="${key}">
                                        <strong>${key.toUpperCase()})</strong> ${val}
                                    </label>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            });

            html += `
                    <button class="btn btn-primary" onclick="submitExam()" style="margin-top: 16px; width: 100%;">Submit Answers</button>
                    <div id="examResult" style="margin-top: 24px; text-align: center; font-size: 1.2rem; font-weight: bold;"></div>
                </div>
            `;
            
            appendMessage('ai', html);
        }

        function submitExam() {
            if(!currentExamData) return;
            let score = 0;
            currentExamData.questions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if(selected && selected.value === q.correct) {
                    score += q.marks;
                }
            });

            const resultDiv = document.getElementById("examResult");
            const percentage = (score / currentExamData.total_marks) * 100;
            let color = percentage >= 70 ? 'var(--success)' : 'var(--accent)';
            
            resultDiv.innerHTML = `You scored: <span style="color: ${color};">${score} / ${currentExamData.total_marks}</span> (${percentage.toFixed(1)}%)`;

            // Give final feedback
            setTimeout(() => {
                appendMessage('ai', `
                    <div style="padding: 16px 20px;">
                        <p>I've evaluated your answers! You scored <b>${percentage.toFixed(1)}%</b>.</p>
                        <p style="margin-top: 8px;">Would you like to generate another exam?</p>
                        <div class="quick-options">
                            <button class="quick-btn" onclick="resetChat()">Yes, start over</button>
                        </div>
                    </div>
                `);
            }, 1000);
        }

        function resetChat() {
            chatState = 0;
            examDetails.course = "";
            examDetails.subject = "";
            examDetails.level = "";
            appendMessage('user', "Yes, start over");
            setTimeout(() => {
                appendMessage('ai', `
                    <div style="padding: 16px 20px;">
                        <p style="margin: 0;">Okay, let's start fresh. <b>What course are you studying?</b></p>
                    </div>
                `);
            }, 500);
        }
    </script>
</body>
</html>
