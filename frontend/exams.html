<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams & Assessments | Quantum Vidya</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .output {
            margin-top: 24px;
            background: var(--surface);
            border: 1px solid var(--primary-glow);
            border-radius: var(--radius-md);
            padding: 32px;
            display: none;
            color: var(--text-main);
        }

        .question-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 24px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            border: 1px solid var(--surface-border);
            transition: transform var(--transition-fast);
        }
        
        .question-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
        }

        .options-list {
            list-style: none;
            margin-top: 16px;
        }

        .options-list li {
            margin-bottom: 12px;
        }

        .options-list label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 8px;
            transition: all var(--transition-fast);
            border: 1px solid transparent;
        }

        .options-list label:hover {
            background: var(--surface-hover);
            border-color: var(--primary-glow);
        }

        input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <nav class="navbar scrolled flex-between container">
        <a href="index.html" class="logo">
            <div class="logo-icon">Q</div>
            Quantum Vidya
        </a>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="elibrary.html">Library</a></li>
            <li><a href="exams.html" class="active">Exams</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <main class="container page-container">
        <div class="glass-card animate-fade-in" style="max-width: 900px; margin: 0 auto;">
            <h1 class="text-gradient">📝 AI Mock Exams</h1>
            <p>Generate highly targeted, interactive practice exams powered by our AI.</p>

            <div class="form-group grid-3" style="margin-bottom: 32px;">
                <div class="field">
                    <label class="form-label">Course Name</label>
                    <input type="text" id="courseInput" class="form-control" placeholder="e.g. BCA">
                </div>
                <div class="field">
                    <label class="form-label">Subject</label>
                    <input type="text" id="subjectInput" class="form-control" placeholder="e.g. DBMS">
                </div>
                <div class="field">
                    <label class="form-label">Difficulty Level</label>
                    <select id="levelInput" class="form-control">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
            </div>

            <div class="flex-center" style="justify-content: flex-start; gap: 16px;">
                <button class="btn btn-primary" id="generateBtn" onclick="startExam()">
                    Start AI Exam
                </button>
                <span id="loadingSpinner" class="loader" style="display: none; width: 28px; height: 28px; border-width: 3px;"></span>
            </div>

            <div class="output animate-fade-in" id="outputBox">
                <!-- Interactive quiz injected here -->
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        let currentExamData = null;

        async function startExam() {
            const course = document.getElementById("courseInput").value.trim();
            const subject = document.getElementById("subjectInput").value.trim();
            const level = document.getElementById("levelInput").value;

            if(!course || !subject) return alert("Please provide Course and Subject.");

            const btn = document.getElementById("generateBtn");
            const spinner = document.getElementById("loadingSpinner");
            const outputBox = document.getElementById("outputBox");

            btn.disabled = true;
            spinner.style.display = "inline-block";
            outputBox.style.display = "none";

            try {
                const data = await QuantumAPI.getExam(course, subject, level);
                currentExamData = data;
                renderExam(data);
            } catch (err) {
                outputBox.innerHTML = `<p style="color: var(--danger);">Error communicating with AI Backend.</p>`;
                outputBox.style.display = "block";
                console.error(err);
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
            }
        }

        function renderExam(data) {
            const outputBox = document.getElementById("outputBox");
            let html = `<h2>${data.subject} Assessment</h2>`;
            html += `<p style="color: var(--text-muted); margin-bottom: 32px;">Level: <strong>${data.level}</strong> | Total Marks: <strong>${data.total_marks}</strong></p>`;
            
            data.questions.forEach((q, idx) => {
                html += `
                    <div class="question-card animate-fade-in" style="animation-delay: ${idx * 100}ms">
                        <h3 style="font-size: 1.15rem;">Q${idx + 1}. ${q.question} <span style="font-size:0.9rem; color: var(--primary); float:right;">[${q.marks} Marks]</span></h3>
                        <ul class="options-list">
                            ${Object.entries(q.options).map(([key, val]) => `
                                <li>
                                    <label>
                                        <input type="radio" name="q_${q.id}" value="${key}">
                                        <strong>${key.toUpperCase()})</strong> ${val}
                                    </label>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            });

            html += `<button class="btn btn-primary" onclick="submitExam()" style="margin-top: 24px;">Submit Exam</button>`;
            html += `<div id="examResult" style="margin-top: 24px; font-weight: 800; font-size: 1.5rem; text-align: center;"></div>`;

            outputBox.innerHTML = html;
            outputBox.style.display = "block";
        }

        function submitExam() {
            if(!currentExamData) return;
            let score = 0;
            currentExamData.questions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if(selected && selected.value === q.correct) {
                    score += q.marks;
                }
            });

            const resultDiv = document.getElementById("examResult");
            const percentage = (score / currentExamData.total_marks) * 100;
            let color = percentage >= 70 ? 'var(--success)' : 'var(--accent)';
            resultDiv.innerHTML = `You scored: <span style="color: ${color};">${score} / ${currentExamData.total_marks}</span> (${percentage.toFixed(1)}%)`;
        }
    </script>
</body>
</html>
