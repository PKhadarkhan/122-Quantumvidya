<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Quantum Vidya</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            margin-top: 100px;
            padding-bottom: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <nav class="navbar flex-between container">
        <a href="index.html" class="logo">
            <div class="logo-icon">Q</div>
            Quantum Vidya
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html" class="btn-ghost">Sign Up</a></li>
        </ul>
    </nav>

    <main class="container login-container animate-fade-in">
        <div class="glass-card">
            <h2 style="font-size: 1.8rem; margin-bottom: 8px;">Welcome back</h2>
            <p>Sign in to your Quantum Vidya account</p>

            <form id="loginForm" class="form" style="margin-top: 20px;">
                <div id="error-msg" style="color: #ff5555; margin-bottom: 15px; font-size: 0.9rem; display: none;"></div>
                
                <div class="field">
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="you@gmail.com" required>
                </div>

                <div class="field">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPass" class="form-control" placeholder="Your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Sign In</button>

                <div style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); text-align: center;">
                    Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const errorMsg = document.getElementById('error-msg');

            const users = JSON.parse(localStorage.getItem('usersData') || '[]');
            const user = users.find(u => u.email === email && u.password === pass);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.textContent = 'Invalid email or password.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
